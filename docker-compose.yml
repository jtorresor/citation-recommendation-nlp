name: mlflow-stack

services:
  # -------------------------------------------------------------------------
  # Backend store: metadatos de experimentos, runs, parametros y metricas.
  # No publica puertos: solo es accesible desde la red interna de Docker.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mlflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - mlflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - mlflow-net

  # -------------------------------------------------------------------------
  # Servidor de tracking (UI + REST API + proxy de artefactos).
  # -------------------------------------------------------------------------
  mlflow:
    image: ${MLFLOW_IMAGE:-mlflow-server:local}
    build:
      context: ./infra/mlflow-server/
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION:-3.16.0}
    container_name: mlflow-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlflow}
      ARTIFACTS_DESTINATION: /mlflow/artifacts
      MLFLOW_PORT: 8080
      MLFLOW_WORKERS: ${MLFLOW_WORKERS:-2}
      # IP elastica o DNS publico de la EC2. Obligatorio: sin esto MLflow 3.x
      # rechaza las peticiones que llegan desde Colab con la IP publica.
      MLFLOW_PUBLIC_HOST: ${MLFLOW_PUBLIC_HOST:?Define MLFLOW_PUBLIC_HOST en .env}
      # Puerto publicado en el host: el navegador lo usa en el header Origin,
      # asi que el contenedor necesita conocerlo para autorizar CORS.
      MLFLOW_PUBLIC_PORT: ${MLFLOW_HOST_PORT:-8080}
      MLFLOW_AUTH_ENABLED: ${MLFLOW_AUTH_ENABLED:-false}
      MLFLOW_AUTH_USERNAME: ${MLFLOW_AUTH_USERNAME:-admin}
      MLFLOW_AUTH_PASSWORD: ${MLFLOW_AUTH_PASSWORD:-}
    ports:
      - "${MLFLOW_HOST_PORT:-8080}:8080"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
      - mlflow-auth:/mlflow/auth
    networks:
      - mlflow-net

# ---------------------------------------------------------------------------
# Volumenes nombrados. Viven en /var/lib/docker/volumes del disco EBS raiz,
# asi que sobreviven a `docker compose down`, a un reinicio y al APAGADO de la
# instancia (stop). NO sobreviven a una terminacion (terminate) de la EC2.
# ---------------------------------------------------------------------------
volumes:
  mlflow-pgdata:
    name: mlflow-pgdata
  mlflow-artifacts:
    name: mlflow-artifacts
  mlflow-auth:
    name: mlflow-auth

networks:
  mlflow-net:
    name: mlflow-net
