server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8001;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8001/health;
    }

    location / {
        proxy_pass http://app:80;
    }
}