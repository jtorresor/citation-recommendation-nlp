services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: intencite-api
    ports:
      - "8001:8001"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: intencite-app

  gateway:
    image: nginx:alpine
    container_name: intencite-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - app